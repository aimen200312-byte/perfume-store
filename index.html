<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>دار المِسك والعود</title>

    <meta name="theme-color" content="#120f0d">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                "Arial",
                "Tahoma",
                sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #30231c 0%,
                    #18120f 45%,
                    #0c0908 100%
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }


        /* =========================
           صفحة الدخول
        ========================= */

        .loading-page {

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            position: relative;

            padding: 20px;
        }


        /* =========================
           زخارف خلفية
        ========================= */

        .circle {

            position: absolute;

            width: 350px;
            height: 350px;

            border: 1px solid
                rgba(212,175,55,.12);

            border-radius: 50%;

            animation:
                pulse 4s infinite ease-in-out;
        }

        .circle::before {

            content: "";

            position: absolute;

            inset: 25px;

            border: 1px solid
                rgba(212,175,55,.08);

            border-radius: 50%;
        }


        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: .5;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }


        /* =========================
           الشعار
        ========================= */

        .logo {

            position: relative;

            z-index: 2;

            animation:
                fadeDown 1.2s ease forwards;
        }


        .small-title {

            color: #f1d878;

            font-size: 13px;

            letter-spacing: 3px;

            margin-bottom: 15px;

            opacity: .9;
        }


        .brand {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: #d4af37;

            font-size:
                clamp(38px, 8vw, 70px);

            font-weight: bold;

            line-height: 1.2;

            text-shadow:
                0 0 20px
                rgba(212,175,55,.18);
        }


        .subtitle {

            color: #eee;

            font-size:
                clamp(13px, 2vw, 17px);

            margin-top: 12px;

            letter-spacing: 1px;
        }


        /* =========================
           الخط الذهبي
        ========================= */

        .gold-line {

            width: 120px;

            height: 1px;

            margin: 25px auto;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d4af37,
                    transparent
                );

            position: relative;
        }


        .gold-line::after {

            content: "✦";

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            color: #d4af37;

            background: #17110e;

            padding: 0 8px;

            font-size: 12px;
        }


        /* =========================
           التحميل
        ========================= */

        .loading {

            position: relative;

            z-index: 2;

            margin-top: 10px;

            color: #aaa;

            font-size: 12px;
        }


        .loader {

            width: 170px;

            height: 3px;

            margin-top: 14px;

            background:
                rgba(255,255,255,.10);

            border-radius: 20px;

            overflow: hidden;
        }


        .loader-bar {

            width: 0%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #a37b08,
                    #f1d878,
                    #d4af37
                );

            border-radius: 20px;

            animation:
                loadingBar 3s
                linear forwards;
        }


        @keyframes loadingBar {

            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }


        /* =========================
           النص السفلي
        ========================= */

        .footer-text {

            position: absolute;

            bottom: 25px;

            color: #777;

            font-size: 11px;

            z-index: 2;
        }


        /* =========================
           ظهور الشعار
        ========================= */

        @keyframes fadeDown {

            from {

                opacity: 0;

                transform:
                    translateY(-25px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================
           الهاتف
        ========================= */

        @media (max-width: 500px) {

            .circle {

                width: 270px;
                height: 270px;
            }

            .small-title {

                font-size: 11px;

                letter-spacing: 2px;
            }

            .subtitle {

                font-size: 12px;
            }

            .loader {

                width: 140px;
            }

        }

    </style>

</head>


<body>


    <div class="loading-page">


        <div class="circle"></div>


        <div class="logo">

            <div class="small-title">
                ✦ أهلاً بك في ✦
            </div>


            <div class="brand">
                دار المِسك والعود
            </div>


            <div class="subtitle">
                عطور عربية أصيلة
            </div>


            <div class="gold-line"></div>


            <div class="loading">
                جاري تحضير متجرك...
            </div>


            <div class="loader">

                <div class="loader-bar"></div>

            </div>

        </div>


        <div class="footer-text">
            عبقٌ يحكي عنك
        </div>


    </div>


    <script>

        /*
         * مدة الانتظار:
         * 3000 = 3 ثوانٍ
         */

        setTimeout(function () {

            window.location.href =
                "perfume-store.html";

        }, 3000);

    </script>


</body>

</html>
